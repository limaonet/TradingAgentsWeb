server:
  port: 8080

spring:
  application:
    name: tradingagents-server
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

  websocket:
    stomp:
      relay:
        host: localhost
        port: 61613

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# 分析状态存储：memory（默认）| redis
analysis:
  storage: ${ANALYSIS_STORAGE:memory}
  state-ttl-days: ${ANALYSIS_STATE_TTL_DAYS:7}
  max-debate-rounds: 1
  max-risk-discuss-rounds: 1
  default-analysts:
    - market
    - social
    - news
    - fundamentals

# LLM Configuration - OpenRouter (国产模型)
llm:
  provider: openrouter
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:[REDACTED]}
    chat-model: ${DEFAULT_CHAT_MODEL:[REDACTED]}
    quick-model: ${DEFAULT_QUICK_MODEL:minimax/minimax-m2.5}

# Data Source Configuration - 专注国内/港股市场
data:
  eastmoney:
    enabled: ${EASTMONEY_ENABLED:true}
    base-url: https://push2.eastmoney.com/api
  tushare:
    token: ${TUSHARE_TOKEN:}
    base-url: https://api.tushare.pro
  sina:
    enabled: true
    base-url: https://hq.sinajs.cn
    kline-base-url: https://quotes.sina.cn
  symbol-resolver:
    enabled: true
    base-url: https://searchapi.eastmoney.com
    token: ${EASTMONEY_SEARCH_TOKEN:D43BF722C8E33BDC906FB84D85E326E8}
  sentiment:
    xueqiu:
      enabled: true
      base-url: https://xueqiu.com
      cookie: ${XUEQIU_COOKIE:}
    guba:
      enabled: true
      base-url: https://guba.eastmoney.com
      cookie: ${GUBA_COOKIE:}
    news:
      enabled: true
      base-url: https://finance.sina.com.cn

logging:
  level:
    com.tradingagents: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
