version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile-backend
    container_name: tradingagents-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - ANALYSIS_STORAGE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}
      - DEFAULT_CHAT_MODEL=${DEFAULT_CHAT_MODEL:-}
      - DEFAULT_QUICK_MODEL=${DEFAULT_QUICK_MODEL:-minimax/minimax-m2.5}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
      - XUEQIU_COOKIE=${XUEQIU_COOKIE:-}
      - GUBA_COOKIE=${GUBA_COOKIE:-}
    depends_on:
      redis:
        condition: service_started
    networks:
      - tradingagents-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile-frontend
    container_name: tradingagents-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tradingagents-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tradingagents-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - tradingagents-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  tradingagents-network:
    driver: bridge

volumes:
  redis-data:
